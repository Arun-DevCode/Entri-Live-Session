<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog - Web Application</title>

    <!--Style Here-->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Blog - Web Application</h1>
      </header>

      <section>
        <form action="#">
          <div>
            <label for="title">Title</label>
            <input name="title" type="text" placeholder="Enter your title" />
          </div>
          <div>
            <label for="desc">Description</label>
            <input name="desc" type="text" placeholder="Enter your title" />
          </div>
          <div>
            <label for="author">Author Name</label>
            <input type="text" name="author" placeholder="Enter your title" />
          </div>
          <button type="submit">Publish</button>
        </form>
      </section>

      <section id="blog-List"></section>
    </main>

    <!--Script Here-->
    <script src="script.js"></script>
  </body>
</html>
